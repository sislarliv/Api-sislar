services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sislar
      POSTGRES_PASSWORD: sislar
      POSTGRES_DB: sislar
    ports:
      - "5432:5432"
    volumes:
      - sislar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sislar -d sislar"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sislar_pg:
